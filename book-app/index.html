<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书收藏</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="text"], input[type="number"] { padding: 6px; }
    #add-form input { flex: 1; min-width: 80px; }
    #add-form input#rating-input { flex: 0 0 90px; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; margin: 8px 0; }
    /* 原生 table 文本可被鼠标拖选复制，满足可复制状态 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; -webkit-user-select: text; user-select: text; }
    th { background: #f5f5f5; }
    .stars { color: #e90; }
    .ops button { margin-right: 4px; }
    .edit-row input { font-size: 14px; padding: 4px; width: 100%; }
  </style>
</head>
<body>
  <h1>图书收藏</h1>
  <form id="add-form">
    <input type="text" id="title-input" placeholder="书名">
    <input type="text" id="author-input" placeholder="作者">
    <input type="number" id="rating-input" min="1" max="5" placeholder="评分1-5">
    <button type="submit">添加</button>
  </form>
  <p class="tip" id="tip"></p>
  <input type="text" id="search-input" placeholder="搜索书名或作者..." style="width:100%; margin-bottom:8px; padding:6px;">
  <table id="book-table">
    <thead>
      <tr><th>书名</th><th>作者</th><th>评分</th><th>操作</th></tr>
    </thead>
    <tbody id="book-list"></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
